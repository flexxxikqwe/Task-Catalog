spring:
  application:
    name: task-catalog
  datasource:
    url: jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 3000

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
